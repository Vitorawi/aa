<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bolinha Saltitante</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@800&family=Public+Sans:wght@500;600&display=swap">
<style>
/* Layout: coluna centralizada, HUD em cima, canvas 16:9 com uma sala de estar (sofá, poltronas, prateleiras, varal), botões de toque embaixo. */
:root {
  --bg: #eef3f6;
  --wall: #e8ecee;
  --wall-low: #dce2e6;
  --window: #a9cde6;
  --window-low: #d2e7f3;
  --floor: #b9835a;
  --floor-line: #8f6240;
  --night: 0;
  --ground-top: #3f8f6b;
  --ball: #ff5a3c;
  --fg: #14202b;
  --muted: #566774;
  --surface: #ffffff;
  --line: #d3dde4;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1820; --window: #1a2b45; --window-low: #33496b; --night: 0.5;
    --ground-top: #3aa37a; --ball: #ff6f55; --fg: #e8eef2; --muted: #9db0bd; --surface: #17252f; --line: #2a3b47;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1820; --window: #1a2b45; --window-low: #33496b; --night: 0.5;
  --ground-top: #3aa37a; --ball: #ff6f55; --fg: #e8eef2; --muted: #9db0bd; --surface: #17252f; --line: #2a3b47;
  color-scheme: dark;
}
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); padding-inline: 16px; padding-block: 24px; }
.wrap { max-width: 720px; margin-inline: auto; display: flex; flex-direction: column; gap: 14px; }
.top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand img { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--ball); flex: none; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.5rem, 6vw, 2.2rem); margin: 0; line-height: 1; }
.hud { display: flex; gap: 16px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--muted); }
.hud b { color: var(--fg); }
.stage { position: relative; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--wall); line-height: 0; touch-action: none; }
canvas { width: 100%; height: auto; max-width: 100%; display: block; }
.overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 16px; line-height: 1.4; background: color-mix(in srgb, var(--bg) 78%, transparent); }
.overlay[hidden] { display: none; }
.overlay h2 { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.4rem, 6vw, 2rem); margin: 0; }
.overlay p { margin: 0; color: var(--muted); }
button { font: inherit; font-weight: 600; background: var(--ball); color: #fff; border: 0; border-radius: 10px; padding: 10px 20px; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
.pad { display: grid; grid-template-columns: 1fr 1fr 1.6fr; gap: 10px; }
.pad button { background: var(--surface); color: var(--fg); border: 1px solid var(--line); padding-block: 18px; font-size: 1.4rem; touch-action: none; user-select: none; -webkit-user-select: none; }
.pad button.on { background: var(--ground-top); color: #fff; }
.pad .jump { background: var(--ball); color: #fff; border: 0; font-size: 1rem; }
.hint { margin: 0; font-size: 13px; color: var(--muted); }
</style>

<style>body { margin: 0; }</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><img id="av" width="40" height="40" alt="Foto do cachorro"><h1>Bolinha Saltitante</h1></div>
    <div class="hud"><span>Hambúrgueres <b id="coins">0/12</b></span><span>Tempo <b id="time">0.0s</b></span></div>
  </div>
  <div class="stage">
    <canvas id="c" width="640" height="360" aria-label="Jogo de plataforma com uma bolinha"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovTitle">Chegue até a vasilha de ração</h2>
      <p id="ovText">Suba nos móveis e pegue os hambúrgueres de brinquedo.</p>
      <button id="start" type="button">Jogar</button>
    </div>
  </div>
  <div class="pad" id="pad">
    <button type="button" data-k="left" aria-label="Esquerda">◀</button>
    <button type="button" data-k="right" aria-label="Direita">▶</button>
    <button type="button" data-k="jump" class="jump" aria-label="Pular">PULAR</button>
  </div>
  <p class="hint">Teclado: setas ou A/D para andar, espaço para pular (segure para pular mais alto).</p>
</div>

      if (overlap(b.x, b.y, p)) {
        if (b.vy > 0) { b.y = p.y - R; if (b.vy > 6) b.sq = 0.3; b.ground = true; coyote = 6; }
        else if (b.vy < 0) { b.y = p.y + p.h + R; }

      }
    });
    b.sq *= 0.82;
    if (ax) b.face = ax; else if (Math.abs(b.vx) > 0.5) b.face = b.vx > 0 ? 1 : -1;
    if (b.ground) b.ph += Math.abs(b.vx) * 0.17;

    coins.forEach(function (c) {
      if (!c.got && Math.hypot(c.x - b.x, c.y - b.y) < R + 9) { c.got = true; got++; coinsEl.textContent = got + "/" + coins.length; }
    });
    if (b.x >= GOAL_X) {
      state = "won";
      show("Você chegou!", got + " de " + coins.length + " hambúrgueres em " + elapsed.toFixed(1) + "s.", "Jogar de novo");
    }
    camX = Math.max(0, Math.min(LEVEL_W - W, b.x - W / 3));
  }

  var D = { body: "#38444f", bodyHi: "#566573", tan: "#d29a55", tanDk: "#a87337", ear: "#2c353e", eye: "#101418" };
  function leg(hx, hy, ph, b, front, far) {
    var mv = Math.min(1, Math.abs(b.vx) / 2.5), fx, fy;
    if (b.ground) {
      fx = hx + Math.sin(ph) * 7 * mv;
      fy = 18 - Math.max(0, Math.cos(ph)) * 5 * mv;
    } else {
      fx = hx + (front ? 7 : -7); fy = 15 + (b.vy > 0 ? 2 : 0);
    }
    ctx.strokeStyle = far ? D.tanDk : D.tan; ctx.lineWidth = 5.5; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(fx, fy - 1); ctx.stroke();
    ctx.fillStyle = far ? D.tanDk : D.tan;
    ctx.beginPath(); ctx.ellipse(fx + 1.5, fy - 0.5, 4.2, 2.6, 0, 0, Math.PI * 2); ctx.fill();
  }
  function ear(bx, by, ang, col) {
    ctx.save(); ctx.translate(bx, by); ctx.rotate(ang);
    ctx.fillStyle = col; ctx.beginPath();
    ctx.moveTo(-6, 1); ctx.quadraticCurveTo(-7, -12, -2, -19); ctx.quadraticCurveTo(7, -12, 8, 1); ctx.closePath(); ctx.fill();
    ctx.fillStyle = D.tanDk; ctx.beginPath();
    ctx.moveTo(-2, 0); ctx.quadraticCurveTo(-2.5, -9, -1, -13); ctx.quadraticCurveTo(3.5, -8, 4, 0); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  function drawDog(b, ts) {
    var mv = Math.min(1, Math.abs(b.vx) / 2.5), ph = b.ph;
    ctx.translate(0, 18); ctx.scale(1.3, 1.3); ctx.translate(0, -18);
    ctx.scale(b.face, 1);
    var bob = b.ground ? Math.abs(Math.sin(ph)) * -1.6 * mv : 0;
    ctx.translate(0, bob);
    // tail
    var wag = Math.sin(ts / (mv > 0.2 ? 70 : 160)) * (mv > 0.2 ? 0.45 : 0.3);
    ctx.save(); ctx.translate(-17, 0); ctx.rotate(-1.0 + wag);
    ctx.strokeStyle = D.body; ctx.lineWidth = 5; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(-7, -8, -15, -5); ctx.stroke();
    ctx.restore();

    leg(-10, 8, ph + Math.PI, b, false, true);
    leg(8, 8, ph, b, true, true);
    // far ear

    ear(7, -14, ea - 0.25, D.ear);
    // body
    ctx.fillStyle = D.body; ctx.beginPath(); ctx.ellipse(-3, 2, 19, 11.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = D.bodyHi; ctx.beginPath(); ctx.ellipse(-5, -4, 13, 4, -0.05, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = D.tan; ctx.beginPath(); ctx.ellipse(10, 6, 6.5, 6, 0, 0, Math.PI * 2); ctx.fill();

    leg(9, 8, ph + Math.PI, b, true, false);
    // head
    ctx.fillStyle = D.tan; ctx.beginPath(); ctx.arc(15, -8, 10.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = D.tanDk; ctx.beginPath(); ctx.ellipse(13, -14, 8.5, 4.5, -0.2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = D.tan; ctx.beginPath(); ctx.ellipse(24, -5, 7, 5, 0.1, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = D.tanDk; ctx.beginPath(); ctx.ellipse(22, 0, 6, 3.2, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = D.eye; ctx.beginPath(); ctx.ellipse(29, -7, 2.8, 2.3, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(19, -10, 2.1, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(19.7, -10.8, 0.7, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = D.ear; ctx.lineWidth = 1.8; ctx.lineCap = "round";

  function hash(n) { var x = Math.sin(n * 127.1) * 43758.5453; return x - Math.floor(x); }
  function rr(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function waffle(x, y, w, h, base, r) {
    ctx.save(); rr(x, y, w, h, r); ctx.fillStyle = base; ctx.fill(); ctx.clip();
    ctx.strokeStyle = "rgba(0,0,0,0.09)"; ctx.lineWidth = 1; ctx.beginPath();
    for (var gx = x + 7; gx < x + w; gx += 8) { ctx.moveTo(gx, y); ctx.lineTo(gx, y + h); }
    for (var gy = y + 7; gy < y + h; gy += 8) { ctx.moveTo(x, gy); ctx.lineTo(x + w, gy); }
    ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,0.22)"; ctx.fillRect(x, y, w, 3);
    ctx.restore();
  }
  function drawWindows() {
    var stepW = 560, k0 = Math.floor(camX * 0.5 / stepW) - 1;
    for (var i = k0; i <= k0 + 3; i++) {
      var wx = i * stepW + 90 - camX * 0.5;
      if (wx > W + 20 || wx + 200 < -20) continue;
      ctx.fillStyle = "#8d9398"; ctx.fillRect(wx, 34, 190, 214);
      var g = ctx.createLinearGradient(0, 42, 0, 240); g.addColorStop(0, C["window"]); g.addColorStop(1, C["window-low"]);
      ctx.fillStyle = g; ctx.fillRect(wx + 8, 42, 174, 198);
      if (C.night > 0) {
        ctx.fillStyle = "rgba(255,214,130,0.85)";
        for (var j = 0; j < 16; j++) ctx.fillRect(wx + 12 + hash(i * 20 + j) * 160, 150 + hash(i * 31 + j + 5) * 82, 3, 4);
      }
      ctx.fillStyle = "#8d9398"; ctx.fillRect(wx + 92, 42, 6, 198); ctx.fillRect(wx + 8, 128, 174, 6);
      ctx.fillStyle = "rgba(255,255,255,0.8)"; ctx.fillRect(wx - 16, 30, 24, 224);
      ctx.strokeStyle = "rgba(0,0,0,0.08)"; ctx.beginPath(); ctx.moveTo(wx - 8, 30); ctx.lineTo(wx - 8, 254); ctx.moveTo(wx - 2, 30); ctx.lineTo(wx - 2, 254); ctx.stroke();
    }
  }
  function drawPlat(p) {
    var t = p.t;
    if (t === "floor") {
      var k0 = Math.floor(camX / 150) - 1;
      for (var k = k0; k <= k0 + 6; k++) {
        ctx.fillStyle = C["floor"]; ctx.fillRect(k * 150, p.y, 150, 30);
        ctx.fillStyle = "rgba(0,0,0," + (hash(k) * 0.09).toFixed(3) + ")"; ctx.fillRect(k * 150, p.y, 150, 30);
        ctx.fillStyle = C["floor"]; ctx.fillRect(k * 150 - 75, p.y + 30, 150, 30);
        ctx.fillStyle = "rgba(0,0,0," + (hash(k + 50) * 0.09).toFixed(3) + ")"; ctx.fillRect(k * 150 - 75, p.y + 30, 150, 30);
        ctx.fillStyle = C["floor-line"]; ctx.fillRect(k * 150, p.y, 1.5, 30); ctx.fillRect(k * 150 - 75, p.y + 30, 1.5, 30);
      }
      ctx.fillStyle = C["floor-line"]; ctx.fillRect(camX - 10, p.y + 30, W + 20, 1.5);
      ctx.fillStyle = "rgba(255,255,255,0.22)"; ctx.fillRect(camX - 10, p.y, W + 20, 2);
    } else if (t === "sofa") {
      rr(p.x + 4, p.y - 80, p.w - 8, 90, 16); ctx.fillStyle = "#6d7d97"; ctx.fill();
      ctx.strokeStyle = "rgba(0,0,0,0.12)"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(p.x + p.w * 0.45, p.y - 70); ctx.lineTo(p.x + p.w * 0.4, p.y - 8); ctx.stroke();
      rr(p.x, p.y, p.w, p.h - 12, 10); ctx.fillStyle = "#7d8da6"; ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.2)"; ctx.fillRect(p.x + 8, p.y + 1, p.w - 16, 3);
      ctx.strokeStyle = "rgba(0,0,0,0.12)"; ctx.beginPath(); ctx.moveTo(p.x + p.w * 0.5, p.y + 5); ctx.lineTo(p.x + p.w * 0.52, p.y + p.h - 16); ctx.stroke();
      ctx.fillStyle = "#d3cec4"; ctx.fillRect(p.x, p.y + p.h - 14, p.w, 14);
    } else if (t === "arm") {
      rr(p.x, p.y, p.w, p.h, 10); ctx.fillStyle = "#d6d1c7"; ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.35)"; ctx.fillRect(p.x + 4, p.y + 2, p.w - 8, 4);
    } else if (t === "cushion") {
      waffle(p.x, p.y, p.w, p.h, "#c9b08f", 8);
    } else if (t === "cushion2") {
      waffle(p.x, p.y, p.w, p.h, "#e7e2d8", 8);
    } else if (t === "chair") {
      rr(p.x, p.y - 44, p.w * 0.3, p.h + 44, 10); ctx.fillStyle = "#a99d8f"; ctx.fill();
      rr(p.x, p.y, p.w, p.h, 8); ctx.fillStyle = "#b9ad9f"; ctx.fill();
      ctx.strokeStyle = "rgba(0,0,0,0.1)"; ctx.lineWidth = 1.5; ctx.beginPath();
      ctx.moveTo(p.x + 4, p.y + p.h * 0.5); ctx.lineTo(p.x + p.w - 4, p.y + p.h * 0.5); ctx.stroke();
      ctx.fillStyle = "rgba(255,255,255,0.25)"; ctx.fillRect(p.x + 6, p.y + 1, p.w - 12, 3);
    } else if (t === "shelf") {
      ctx.fillStyle = "#8f6234";
      [14, p.w - 24].forEach(function (o) { ctx.beginPath(); ctx.moveTo(p.x + o, p.y + p.h); ctx.lineTo(p.x + o + 10, p.y + p.h); ctx.lineTo(p.x + o, p.y + p.h + 16); ctx.fill(); });
      ctx.fillStyle = "#b8844d"; ctx.fillRect(p.x, p.y, p.w, p.h);
      ctx.fillStyle = "rgba(255,255,255,0.22)"; ctx.fillRect(p.x, p.y, p.w, 3);
    } else if (t === "rack") {
      ctx.strokeStyle = "#d4d8db"; ctx.lineWidth = 3; ctx.lineCap = "round"; ctx.beginPath();
      ctx.moveTo(p.x + 10, p.y + 8); ctx.lineTo(p.x - 4, 299); ctx.moveTo(p.x + p.w - 10, p.y + 8); ctx.lineTo(p.x + p.w + 4, 299);
      ctx.moveTo(p.x + 22, p.y + 8); ctx.lineTo(p.x + 40, 299); ctx.moveTo(p.x + p.w - 22, p.y + 8); ctx.lineTo(p.x + p.w - 40, 299); ctx.stroke();
      ctx.fillStyle = "#4a6fa5"; ctx.fillRect(p.x + 18, p.y + 9, 26, 40);
      ctx.fillStyle = "#e7a6b8"; ctx.fillRect(p.x + 52, p.y + 9, 20, 30);
      ctx.fillStyle = "#e9e4d6"; ctx.fillRect(p.x + 80, p.y + 9, 22, 34);
      ctx.fillStyle = "#e3e6e8"; rr(p.x, p.y, p.w, p.h, 4); ctx.fill();
    } else if (t === "pouf") {
      rr(p.x, p.y, p.w, p.h, 14); ctx.fillStyle = "#9a8e82"; ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.22)"; ctx.fillRect(p.x + 8, p.y + 2, p.w - 16, 4);
    } else { ctx.fillStyle = "#999"; ctx.fillRect(p.x, p.y, p.w, p.h); }
  }
  function drawBowls() {
    var x = 3070;
    ctx.fillStyle = "#d49a4a"; ctx.fillRect(x, 262, 110, 38);
    ctx.fillStyle = "rgba(0,0,0,0.12)"; ctx.fillRect(x, 262, 110, 4);
    [x + 28, x + 82].forEach(function (cx, i) {
      ctx.fillStyle = "#b8bec4"; ctx.beginPath(); ctx.ellipse(cx, 262, 21, 7, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = i === 0 ? "#6b4a2f" : "#6e9bd1"; ctx.beginPath(); ctx.ellipse(cx, 262, 16, 4.5, 0, 0, Math.PI * 2); ctx.fill();
    });
  }
  function drawBurger(c, k, ts) {
    var y0 = c.y + Math.sin(ts / 260 + k) * 2.5, x = c.x;
    ctx.fillStyle = "#f2b705"; rr(x - 11, y0 + 3, 22, 5, 2.5); ctx.fill();
    ctx.fillStyle = "#c0392b"; ctx.fillRect(x - 11, y0 - 1, 22, 4);
    ctx.fillStyle = "#52b04a"; rr(x - 12.5, y0 - 3.5, 25, 3.5, 1.7); ctx.fill();
    ctx.fillStyle = "#ffc61a"; ctx.beginPath(); ctx.ellipse(x, y0 - 3, 11.5, 8, 0, Math.PI, 0); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.5)"; ctx.beginPath(); ctx.ellipse(x - 4, y0 - 8, 3.5, 1.6, -0.4, 0, Math.PI * 2); ctx.fill();
  }
  function draw(ts) {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, C["wall"]); g.addColorStop(1, C["wall-low"]);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    drawWindows();

    ctx.save(); ctx.translate(-Math.round(camX), 0);
    ctx.fillStyle = "#f1f1ee"; ctx.fillRect(camX - 10, 286, W + 20, 14);
    ctx.fillStyle = "rgba(0,0,0,0.1)"; ctx.fillRect(camX - 10, 286, W + 20, 1.5);
    plats.forEach(function (p) {
      if (p.t !== "floor" && (p.x + p.w + 20 < camX || p.x - 20 > camX + W)) return;
      drawPlat(p);
    });
    drawBowls();
    ctx.restore();

    if (C.night > 0) { ctx.fillStyle = "rgba(6,12,28," + C.night + ")"; ctx.fillRect(0, 0, W, H); }

    ctx.save(); ctx.translate(-Math.round(camX), 0);
    coins.forEach(function (c, k) { if (!c.got) drawBurger(c, k, ts); });
    var b = ball, sx = 1 + b.sq, sy = 1 - b.sq;
    ctx.fillStyle = "rgba(0,0,0,0.2)"; ctx.beginPath(); ctx.ellipse(b.x, b.y + R, R * 1.1, 3, 0, 0, Math.PI * 2); ctx.fill();
    ctx.save(); ctx.translate(b.x, b.y + R); ctx.scale(sx, sy); ctx.translate(0, -R);
    drawDog(b, ts);
    ctx.restore();
    ctx.restore();
  }

  var last = 0, acc = 0;
  function loop(ts) {
    var dt = Math.min(50, ts - last); last = ts;
    if (state === "play") {
      acc += dt;
      while (acc >= 16.67) { step(); acc -= 16.67; if (state !== "play") break; }
      elapsed = (performance.now() - t0) / 1000;
      timeEl.textContent = elapsed.toFixed(1) + "s";
    }
    draw(ts);
    requestAnimationFrame(loop);
  }

  function press(k, down) {
    if (k === "jump") {
      if (down && !keys.jump) jumpBuf = 8;
      jumpHeld = down;
    }
    keys[k] = down;
  }
  var map = { ArrowLeft: "left", a: "left", A: "left", ArrowRight: "right", d: "right", D: "right", " ": "jump", ArrowUp: "jump", w: "jump", W: "jump" };
  window.addEventListener("keydown", function (e) {
    var k = map[e.key]; if (!k) return;
    if (e.target && e.target.tagName === "BUTTON" && e.key === " " && state !== "play") return;
    e.preventDefault(); if (!e.repeat) press(k, true);
  });
  window.addEventListener("keyup", function (e) { var k = map[e.key]; if (k) { e.preventDefault(); press(k, false); } });
  window.addEventListener("blur", function () { press("left", false); press("right", false); press("jump", false); });

  document.querySelectorAll("#pad button").forEach(function (btn) {
    var k = btn.getAttribute("data-k");
    btn.addEventListener("pointerdown", function (e) { e.preventDefault(); btn.setPointerCapture && btn.setPointerCapture(e.pointerId); btn.classList.add("on"); press(k, true); });
    ["pointerup", "pointercancel", "lostpointercapture"].forEach(function (ev) {
      btn.addEventListener(ev, function () { btn.classList.remove("on"); press(k, false); });
    });
    btn.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  });

  reset();
  requestAnimationFrame(loop);
})();
